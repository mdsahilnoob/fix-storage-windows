name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows build (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test read-only CLI modes
        shell: pwsh
        run: |
          node bin/fix-storage.cjs --help
          node bin/fix-storage.cjs --demo --plain
          node bin/fix-storage.cjs --demo --json | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))'
      - name: Package contents
        run: npm pack --dry-run

# The inherited Bun tests exercise Unix/POSIX behavior and permanent-delete
# dry-run expectations. Windows-specific tests must be added in the separately
# approved test phase before a test job is enabled here.
