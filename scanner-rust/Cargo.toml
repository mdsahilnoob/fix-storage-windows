[package]
name = "fix-storage-scanner-rust"
version = "0.1.0"
edition = "2021"
description = "Read-only Windows scanner prototype for fix-storage-windows"
license = "MIT"
publish = false

[lib]
name = "fix_storage_scanner_rust"
path = "src/lib.rs"

[[bin]]
name = "fix-storage-scanner-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
